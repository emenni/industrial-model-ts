name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
    env:
      CDF_CLIENT_NAME: ${{ secrets.CDF_CLIENT_NAME }}
      CDF_CLUSTER: ${{ secrets.CDF_CLUSTER }}
      CDF_DATA_MODEL_EXTERNAL_ID: ${{ secrets.CDF_DATA_MODEL_EXTERNAL_ID }}
      CDF_DATA_MODEL_SPACE: ${{ secrets.CDF_DATA_MODEL_SPACE }}
      CDF_DATA_MODEL_VERSION: ${{ secrets.CDF_DATA_MODEL_VERSION }}
      CDF_CLIENT_ID: ${{ secrets.CDF_CLIENT_ID }}
      CDF_CLIENT_SECRET: ${{ secrets.CDF_CLIENT_SECRET }}
      CDF_TOKEN_URL: ${{ secrets.CDF_TOKEN_URL }}
      CDF_PROJECT: ${{ secrets.CDF_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        
      - name: Lint and typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
